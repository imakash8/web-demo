function toast(message,type=''){const el=document.createElement('div');el.className='toast '+type;el.innerHTML=icon(type==='error'?'alert':'checkcircle')+'<span>'+esc(message)+'</span>';$('#toastHost').append(el);setTimeout(()=>el.remove(),6500);}
function modal(title,subtitle,content,footer='',cls=''){
 modalLastFocus=document.activeElement;
 $('#modalHost').innerHTML=`<div class="modal-backdrop ${cls.includes('drawer')?'drawer-backdrop':''}" id="modalBackdrop"><section class="modal ${cls.replace('drawer','')}" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1"><div class="modal-header"><div><h2 id="modalTitle">${title}</h2><p>${subtitle}</p></div><button class="icon-btn" data-action="closeModal" aria-label="Close dialog">${icon('close')}</button></div><div class="modal-content">${content}</div>${footer?`<div class="modal-footer">${footer}</div>`:''}</section></div>`;
 document.body.style.overflow='hidden';setTimeout(()=>$('.modal input:not([type=hidden]),.modal select,.modal textarea,.modal button')?.focus(),30);
}
function closeModal(){document.body.style.overflow='';$('#modalHost').innerHTML='';if(modalLastFocus?.isConnected)modalLastFocus.focus();}
function formModal(title,subtitle,content,formId,submit='Save',cls=''){modal(title,subtitle,`<form id="${formId}">${content}<div class="error-text" id="formError" role="alert"></div></form>`,btn('Cancel','closeModal')+`<button class="btn primary" type="submit" form="${formId}">${icon('check')}${submit}</button>`,cls);}
const formError=text=>{const el=$('#formError')||$('#consultError');if(el){el.textContent=text;el.scrollIntoView({block:'nearest'});}else toast(text,'error');return false;};

 modal(esc(p.name),'Patient history · every visit stays separate',`<div class="profile-band">${avatar(p,true)}<div><h3>${esc(p.name)}</h3><p class="small muted">${esc(p.id)} · ${p.age?esc(p.age)+' years':'Age not recorded'} · ${esc(p.village)}</p><p style="font-size:10px;color:var(--muted);margin-top:6px">Contact: ${esc(p.phone||'Not recorded')} ${p.phone?.startsWith('00000')?'(fictional placeholder)':''}</p></div></div><div class="grid-3 mb20" style="grid-template-columns:repeat(3,1fr)"><div class="kpi-mini"><div class="label">Visits</div><div class="amount">${vs.length}</div></div><div class="kpi-mini"><div class="label">Balance due</div><div class="amount gold" style="font-size:18px">${inr(sum(vs,v=>dueFor(v)))}</div></div><div class="kpi-mini"><div class="label">Next follow-up</div><div class="amount" style="font-size:16px">${fs[0]?fmt(fs[0].date):'None'}</div></div></div><div class="notice mb16">${icon('info')}<div><strong>Allergies / uncertainty:</strong> ${esc(p.allergies||'Not recorded')}<br><strong>WhatsApp permission:</strong> ${p.whatsappConsent?'Recorded in this fictional demo':'Not recorded; confirm separately before messaging'}</div></div><div class="between mb16"><h3>Visit timeline</h3>${btn('Edit patient details','editPatient','sm',`data-id="${p.id}"`,'edit')}</div><div class="timeline">${vs.map(v=>`<div class="timeline-item"><span class="timeline-date">${fmt(v.date,{day:'numeric',month:'long',year:'numeric'})} · ${esc(v.time||'')}</span><div class="timeline-card"><div class="between"><h3>${esc(v.complaint||'Consultation')}</h3>${statusBadge(paymentStatus(v))}</div><p>${esc(v.summary)}</p><div class="flex gap8 wrap mt12">${btn('Visit details','visit','sm',`data-id="${v.id}"`,'file')}${v.attachment?btn('Original note','viewNote','sm',`data-id="${v.id}"`,'camera'):''}<span class="muted" style="font-size:10px">Charged ${inr(totalCharge(v))} · Paid ${inr(paidFor(v.id))}</span></div></div></div>`).join('')||empty('A new beginning.','No visits saved for this patient yet.','file')}</div>`,btn('New consultation','consultPatient','primary',`data-id="${p.id}"`,'mic')+btn('Book appointment','addAppt','',`data-patient="${p.id}"`,'calendar'),'drawer');

function whatsappAppointment(){modal('Turn a message into an appointment.','A reviewed hand-off, not access to her private WhatsApp inbox.',`<div class="notice mb16">${icon('message')}<div><strong>Sample parser only.</strong> In a real local app, she would copy/share a message into the app. This demo reads only the text entered below.</div></div><div class="field"><label for="waAppointmentText">Message text</label><textarea id="waAppointmentText" rows="4">Namaste, main Kavita Nishad. Kal subah 11 baje appointment mil sakta hai?</textarea><small>Demo message received: 5 October 2026. “Kal” alone can be ambiguous; the draft must be reviewed.</small></div><div id="waParsed" class="mt16"></div>`,btn('Review sample request','parseAppointment','primary','','spark'));}
function parseAppointment(){
 const text=$('#waAppointmentText').value.trim();if(!text){toast('Paste a fictional message first.','error');return;}
 const known=S.patients.find(p=>text.toLowerCase().includes(p.name.toLowerCase())),tomorrow=/\bkal\b|कल|tomorrow/i.test(text),timeMatch=text.match(/\b(\d{1,2})(?::(\d{2}))?\s*(?:baje|बजे|am|pm)/i);
 const sourceDate=TODAY;let time='';if(timeMatch){let h=Number(timeMatch[1]);const pm=/\bpm\b|shaam|शाम/i.test(text);if(pm&&h<12)h+=12;if(h<=23)time=String(h).padStart(2,'0')+':'+(timeMatch[2]||'00');}
 $('#waParsed').innerHTML=`<div class="match-card"><h3 class="mb12">Review suggested details</h3><div class="form-grid">${selectField('Confirm patient identity','wPatient',[['','Choose patient — never inferred automatically'],...patientOpts()],known?.id||'')}${inputField('Requested date — confirm meaning','wDate',tomorrow?addDays(sourceDate,1):sourceDate,'date')}${inputField('Requested time — confirm AM / PM','wTime',time,'time')}<div class="field"><label>Booking status</label><span class="badge gold" style="align-self:start">Not booked until confirmed</span></div></div><p class="small muted mt12">${known?'Name matched in this sample, but a name alone is not identity confirmation.':'No exact full-name match. Select the correct patient manually.'}</p></div>${btn('Open booking form','confirmParsedAppointment','primary mt16','','arrow')}`;
}

function deductStock(m,quantity,type,note,visitId=''){
 if(!m||!Number.isFinite(quantity)||quantity<=0)throw Error('Enter a valid positive quantity.');
 if(quantity>available(m)+.000001)throw Error('Not enough usable stock. No stock was changed.');
 let left=quantity;const batches=m.batches.filter(b=>b.qty>0&&(!b.expiry||b.expiry>=TODAY)).sort((a,b)=>(a.expiry||'9999').localeCompare(b.expiry||'9999'));
 for(const b of batches){if(left<=.000001)break;const q=Math.min(left,b.qty);b.qty=Math.round((b.qty-q)*10000)/10000;left-=q;S.movements.push({id:uid('MV'),itemId:m.id,batchId:b.id,date:TODAY,type,qty:-q,note,visitId});}
}

 else if(/collect|earn|revenu|money|income|paid|कमाई/i.test(q)){const range=/today/i.test(q)?'today':'month',ps=S.payments.filter(p=>within(p.date,range)),cash=sum(ps.filter(p=>p.method==='Cash'),p=>p.amount),upi=sum(ps.filter(p=>p.method==='UPI'),p=>p.amount);answer=`<strong>${inr(cash+upi)} was collected ${range==='today'?'today':'from 1–5 October 2026'}.</strong><br>Cash: ${inr(cash)}<br>UPI: ${inr(upi)}<br>This is recorded money received, not total fees charged or net profit.`;source='Payment receipt ledger · date received';links='<button class="text-link" data-go="finance">Open payment receipts →</button>';}

 else {const p=S.patients.find(p=>low.includes(p.name.toLowerCase())||low.includes(p.name.split(' ')[0].toLowerCase()));if(p){const vs=S.visits.filter(v=>v.patientId===p.id).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));const v=vs[0];answer=`<strong>${esc(p.name)} · ${esc(p.id)}</strong><br>${vs.length} saved visits. ${v?`Latest: ${fmt(v.date)} — ${esc(v.complaint)}.<br><br>${/medicine|recorded|last time/i.test(q)?`Confirmed note transcription: ${esc(v.medicineText||'No confirmed medicine transcription. Check the attached original note; no medicine is inferred.')}`:vs.slice(0,3).map(x=>`${fmt(x.date)}: ${esc(x.complaint)}`).join('<br>')}`:'No visits recorded yet.'}`;source=v?'Patient timeline · '+v.id:'Patient register';links=`<button class="text-link" data-action="patient" data-id="${p.id}">Open source patient record →</button>`;}else{answer='This demo understands a small set of questions about follow-ups, collections, low stock, Arang visits and patients named in the sample register. Try one of the suggested questions above. It is not a live language model.';source='Rule-based demo; no answer was invented from missing records.';}}

function updateCheckout(){if(!$('#cFee'))return;draft.fee=Number($('#cFee').value);draft.medicineFee=Number($('#cMedicineFee').value);draft.discount=Number($('#cDiscount').value);draft.paymentMethod=$('#cMethod').value;draft.paid=draft.paymentMethod==='Unpaid'?0:Number($('#cPaid').value);if(draft.paymentMethod==='Unpaid')$('#cPaid').value=0;$('#cPaid').disabled=draft.paymentMethod==='Unpaid';$('#cCashPart').disabled=draft.paymentMethod!=='Split';draft.cashPart=Number($('#cCashPart').value);draft.dispense=$('#cDispense').checked;draft.dispenseItem=$('#cDispenseItem').value;draft.dispenseQty=Number($('#cDispenseQty').value);$('#checkoutTotal').textContent=inr(Math.max(0,draft.fee+draft.medicineFee-draft.discount));$('#checkoutDue').textContent=inr(Math.max(0,draft.fee+draft.medicineFee-draft.discount-draft.paid));$('#dispenseUnit').textContent='Stock unit: '+(item(draft.dispenseItem)?.unit||'')+'. No conversion from drops or prescribed dose is assumed.';}
function createPatient(fields){const max=Math.max(0,...S.patients.map(p=>Number(p.id.replace('HHC-',''))||0)),p={id:'HHC-'+String(max+1).padStart(4,'0'),name:fields.name,age:fields.age,village:fields.village||'Not recorded',phone:fields.phone||'',sex:'Not recorded',created:TODAY,color:S.patients.length%5,whatsappConsent:false,allergies:fields.allergies||'Not recorded',notes:''};S.patients.push(p);return p;}
function saveVisit(){
 if(draft.savedId){toast('This visit is already saved. Start a new consultation for another visit.');return;}
 updateCheckout();const d=draft,f=d.fields,total=d.fee+d.medicineFee-d.discount;
 if(!d.reviewApproved||!['existing','new'].includes(d.identity))return formError('Confirm the patient identity and reviewed summary before saving.');
 if(![d.fee,d.medicineFee,d.discount,d.paid].every(x=>Number.isFinite(x)&&x>=0)||total<0)return formError('Enter valid, non-negative amounts. Discount cannot exceed the charge.');
 if(d.paid>total+.001)return formError('Amount received cannot exceed this visit’s total charge.');
 if(d.paymentMethod==='Split'&&(!Number.isFinite(d.cashPart)||d.cashPart<0||d.cashPart>d.paid))return formError('Cash portion must be between zero and the total received.');
 const m=item(d.dispenseItem);if(d.dispense&&(!m||!Number.isFinite(d.dispenseQty)||d.dispenseQty<=0||d.dispenseQty>available(m)))return formError('Enter a positive dispensing quantity no greater than the usable stock.');
 let p=d.identity==='existing'?patient(d.matchId):null;if(d.identity==='existing'&&!p)return formError('The selected patient record no longer exists. Review identity again.');
 if(!p)p=createPatient(f);else if(d.applyCorrections){p.name=f.name;p.age=f.age;p.village=f.village||p.village;if(f.phone)p.phone=f.phone;}
 const id=uid('VISIT'),v={id,patientId:p.id,date:TODAY,time:'11:30',complaint:f.complaint,duration:f.duration,summary:f.summary,allergies:f.allergies,notes:d.notes,transcript:d.manual?'':transcriptLines().map(([s,t])=>s+': '+t).join('\n\n'),consent:d.manual?false:d.consent,reviewed:true,attachment:d.attachment,medicineText:d.medicineText,followupDate:f.followupDate||null,fee:d.fee,medicineFee:d.medicineFee,discount:d.discount};
 if(d.dispense)deductStock(m,d.dispenseQty,'Dispensed','Confirmed at visit completion',id);
 S.visits.push(v);
 if(d.paid>0){if(d.paymentMethod==='Split'){if(d.cashPart>0)S.payments.push({id:uid('PAY'),visitId:id,date:TODAY,amount:d.cashPart,method:'Cash'});if(d.paid-d.cashPart>0)S.payments.push({id:uid('PAY'),visitId:id,date:TODAY,amount:Math.round((d.paid-d.cashPart)*100)/100,method:'UPI'});}else S.payments.push({id:uid('PAY'),visitId:id,date:TODAY,amount:d.paid,method:d.paymentMethod});}
 if(f.followupDate)S.followups.push({id:uid('F'),patientId:p.id,visitId:id,date:f.followupDate,status:'Due',contacted:false,reminderDate:null});
 const a=S.appointments.find(a=>a.id===d.appointmentId);if(a)a.status='Completed';
 d.savedId=id;d.stage='complete';persist();render();toast('Visit saved. Patient history, follow-up and financial totals are updated.');
}
async function loadNoteFile(file){if(!file)return;if(!/^image\/(jpeg|png|webp)$/.test(file.type)){toast('Choose a JPEG, PNG or WebP test image.','error');return;}if(file.size>1.5*1024*1024){toast('Use a test image below 1.5 MB in this browser demo. No file was stored.','error');return;}
 const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Could not read the image.'));r.readAsDataURL(file);});
 draft.attachment=data;draft.medicineText='';draft.ocrConfirmed=false;render();toast('Test image attached locally. OCR is not run on uploaded images; enter reviewed text manually.');}

async function copyText(text){if(navigator.clipboard?.writeText){try{await navigator.clipboard.writeText(text);return;}catch(e){}}const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw Error('Clipboard access was blocked. Select and copy the editable message manually.');}

document.addEventListener('click',async event=>{
 const go=event.target.closest('[data-go]');if(go){if($('#modalHost').innerHTML)closeModal();navigate(go.dataset.go);return;}
 const el=event.target.closest('[data-action]');if(el){event.preventDefault();try{await handleAction(el.dataset.action,el);}catch(err){console.error(err);formError(err.message||'This demo action could not be completed.');}return;}
 if(event.target.id==='navBackdrop'){$('#sidebar').classList.remove('open');$('#navBackdrop').classList.remove('open');}
 if(event.target.id==='modalBackdrop')closeModal();
 if(!event.target.closest('.topbar-search'))$('#globalResults')?.classList.add('hidden');
});
document.addEventListener('submit',async event=>{event.preventDefault();try{await handleSubmit(event.target);}catch(err){console.error(err);formError(err.message||'Please review the form and try again.');}});
function rerenderSearch(id,value){query=value;render();const input=$('#'+id);input?.focus();input?.setSelectionRange(value.length,value.length);}
document.addEventListener('input',event=>{
 const el=event.target;
 if(el.id==='patientSearch'||el.id==='inventorySearch'){rerenderSearch(el.id,el.value);return;}
 if(el.id==='globalSearch'){const q=el.value.trim().toLowerCase(),box=$('#globalResults');if(!q){box.classList.add('hidden');return;}const ps=S.patients.filter(p=>[p.name,p.id,p.village,p.phone].join(' ').toLowerCase().includes(q)).slice(0,5),ms=S.inventory.filter(m=>(m.name+' '+m.potency).toLowerCase().includes(q)).slice(0,3);box.innerHTML=ps.map(p=>`<button class="search-result" data-action="patient" data-id="${p.id}">${avatar(p)}<span><strong style="font-size:11px">${esc(p.name)}</strong><small class="muted" style="display:block;font-size:9px">${esc(p.id)} · ${esc(p.village)}</small></span></button>`).join('')+ms.map(m=>`<button class="search-result" data-action="item" data-id="${m.id}"><span class="stat-icon">${icon('box')}</span><span style="font-size:11px">${esc(m.name)} ${esc(m.potency)}</span></button>`).join('')||'<div class="empty" style="padding:17px;font-size:11px">No matching demo records.</div>';box.classList.remove('hidden');}
 if(el.dataset.purchase){const r=purchaseRows[Number(el.dataset.index)],key=el.dataset.purchase;r[key]=['qty','cost'].includes(key)?Number(el.value):el.value;if(key==='itemId'){r.cost=item(el.value)?.cost||0;renderPurchaseRows();}else updatePurchaseTotal();}
 if(['cFee','cMedicineFee','cDiscount','cPaid','cCashPart','cDispenseQty'].includes(el.id))updateCheckout();
 if(el.id==='waMessage')$('#waBubble').textContent=el.value;
 if(el.id==='closingActual')$('#closingDifference').textContent=inr(Number(el.value)-Number($('#closingExpected').value));
});
document.addEventListener('change',async event=>{
 const el=event.target;
 if(el.id==='recordConsent'&&draft)draft.consent=el.checked;
 if(el.name==='identity'&&draft)draft.identity=el.value;
 if(el.id==='patientVillage'){patientVillage=el.value;render();}
 if(el.id==='appointmentDate'){appointmentDay=el.value||TODAY;render();}
 if(el.id==='payVisit')$('#payAmount').value=dueFor(visit(el.value));
 if(['cMethod','cDispense','cDispenseItem'].includes(el.id))updateCheckout();
 if(el.id==='manualPatient'){readReview();if(el.value!=='new'){const p=patient(el.value);draft.matchId=p.id;draft.identity='existing';Object.assign(draft.fields,{name:p.name,age:p.age,village:p.village,phone:p.phone,allergies:p.allergies});}else{draft.identity='new';Object.assign(draft.fields,{name:'',age:'',village:'',phone:'',allergies:'Not recorded'});}render();}
 if(el.id==='cLanguage'&&!draft.manual){readReview();draft.fields.summary=el.value==='हिन्दी'?'रोगी ने लगभग एक सप्ताह से पेट में तकलीफ़ बताई, जो खाने के बाद अधिक लगती है। एलर्जी की जानकारी की पुष्टि नहीं हुई। चिकित्सक ने नोटबुक में विवरण लिखा और 19 अक्टूबर 2026 को फॉलो-अप के लिए कहा। कोई निदान, दवा या खुराक अनुमान से नहीं जोड़ी गई है।':'The patient reported abdominal discomfort for approximately one week, more noticeable after meals. Allergy history was not confirmed. The practitioner recorded notes by hand and explicitly requested a follow-up on 19 October 2026. No diagnosis or treatment recommendation has been inferred.';$('#cSummary').value=draft.fields.summary;}
 if(el.id==='noteFile'||el.id==='noteCamera'){try{await loadNoteFile(el.files[0]);}catch(e){toast(e.message,'error');}}
});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&!locked){closeModal();$('#globalResults')?.classList.add('hidden');$('#sidebar').classList.remove('open');$('#navBackdrop').classList.remove('open');}
 if(event.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!locked){event.preventDefault();$('#globalSearch')?.focus();}
 if(event.key==='Tab'&&$('#modalHost').innerHTML){const focusable=$$('.modal button:not(:disabled),.modal input:not(:disabled):not([type=hidden]),.modal select:not(:disabled),.modal textarea:not(:disabled),.modal [tabindex="0"]');if(!focusable.length)return;const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
});
window.addEventListener('hashchange',()=>{const target=location.hash.slice(1);if(pages[target]&&target!==page)navigate(target);});
window.addEventListener('beforeunload',()=>{clearInterval(recordTimer);});
page=pages[location.hash.slice(1)]?location.hash.slice(1):'overview';
persist(true);render();

</script>
</body></html>
